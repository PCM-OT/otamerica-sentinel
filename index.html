<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTAMERICA | SENTINEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External Libs needed for PDF/Excel generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- tailwind.config saiu de um <script> inline para um arquivo servido pela
         própria origem: assim o CSP dispensa 'unsafe-inline' em script-src.
         Precisa vir DEPOIS do CDN, que é quem define o objeto `tailwind`. -->
    <script src="/tailwind-config.js"></script>
    <!-- Mesma razão para o <style> inline virar folha de estilo. -->
    <link rel="stylesheet" href="/app-base.css">
</head>
<body>
    <div id="root"></div>
     <script type="module" src="/index.tsx"></script>
</body>
</html>
